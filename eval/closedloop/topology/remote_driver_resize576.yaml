# @package _global_
# AlpaSim wizard topology used for the 150-scene closed-loop runs (copy into src/wizard/configs/topology/).
# Renderer / physics / trafficsim / controller / runtime run on the simulation GPU host; the Pisco driver runs on a
# separate GPU host and is reached over gRPC (renderer alone peaks at ~18 GB on a 24 GB card, so a 2B driver
# does not fit next to it). One rollout at a time through the driver.
# Point wizard.external_services.driver at the driver host, e.g.  wizard.external_services.driver=[<DRIVER_HOST>:6789]
#
# Needs the runtime patches listed in eval/closedloop/README.md (driver RPC keepalive/retries, ALPASIM_DRIVER_IMAGE_WH).

defaults:
  - 1gpu
  - _self_

services:
  renderer:
    gpus: [0]
  driver:
    gpus: [0]   # not started (external)
  physics:
    gpus: [0]
  trafficsim:
    gpus: [0]
  runtime:
    environments:
      - ALPASIM_DRIVER_RPC_TIMEOUT_S=1800
      # downscale camera frames to the driver input size on the simulation host before sending
      - ALPASIM_DRIVER_IMAGE_WH=576x320

wizard:
  run_sim_services: ["renderer", "physics", "trafficsim", "controller", "runtime"]
  external_services:
    driver: ["<DRIVER_HOST>:6789"]

runtime:
  endpoints:
    driver:
      n_concurrent_rollouts: 1
