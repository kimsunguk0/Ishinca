[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ishinca_alpasim"
version = "0.1.0"
description = "AlpaSim driver plugin: registers the Ishinca-4B VLA as model_type 'ishinca'"
requires-python = ">=3.10"
dependencies = ["ishinca"]

[project.entry-points."alpasim.models"]
ishinca = "ishinca_alpasim.model:IshincaDriverModel"

[tool.setuptools]
packages = ["ishinca_alpasim"]
